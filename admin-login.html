<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | FAITH'S GADGETS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #111;
            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="login-box">

        <h1>
            FAITH'S GADGETS
        </h1>

        <p class="subtitle">
            Admin Login
        </p>


        <form id="login-form">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Admin email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >


            <button
                type="submit"
                id="login-button"
            >
                Login
            </button>

        </form>


        <div id="message"></div>


        <a
            href="index.html"
            class="home-link"
        >
            ← Back to Store
        </a>

    </div>

</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
    "https://xlndevzrexpshpkruwho.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_K3goJriHOTqkoFXEb839Zw_3ozu3V6F";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const form =
    document.getElementById(
        "login-form"
    );


const button =
    document.getElementById(
        "login-button"
    );


const message =
    document.getElementById(
        "message"
    );


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        button.disabled = true;

        button.textContent =
            "Logging in...";


        message.textContent = "";


        const {
            data,
            error
        } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            console.error(error);

            message.textContent =
                "Invalid email or password.";

            message.style.color =
                "red";

            button.disabled = false;

            button.textContent =
                "Login";

            return;
        }


        message.textContent =
            "Login successful!";

        message.style.color =
            "green";


        setTimeout(
            function() {

                window.location.href =
                    "admin.html";

            },
            1000
        );

    }
);


</script>


</body>

</html>
